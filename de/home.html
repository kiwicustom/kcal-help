<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Home — Hilfe · kCal Buddy</title>
    <meta name="theme-color" content="#FF7A00" />
    <link rel="icon" href="../assets/brand/kcal-mark-64.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/tokens.css?v=card-stack-1" />
    <link rel="stylesheet" href="../css/shell.css?v=card-stack-1" />
    <link rel="stylesheet" href="../css/help.css?v=card-stack-1" />
  </head>
  <body>
    <div id="help-shell-header"></div>
    <main class="help-main">
      <p class="crumb"><a href="index.html">Hilfe</a> · Home</p>
      <h1>Home — Bild-Guide</h1>
      <p class="lead">Playwright-Screenshots aus der App.</p>
      <figure class="shot-wrap">
        <img src="../assets/screenshots/home-overview.png" alt="Home Übersicht" />
        <figcaption class="caption">home-overview.png</figcaption>
      </figure>
      <figure class="shot-wrap">
        <img src="../assets/screenshots/home-quick-actions.png" alt="Quick Actions" />
        <figcaption class="caption">home-quick-actions.png</figcaption>
      </figure>
      <figure class="shot-wrap">
        <img src="../assets/screenshots/home-budget.png" alt="Today's Progress" />
        <figcaption class="caption">home-budget.png</figcaption>
      </figure>
      <div class="callout callout--warn">
        <span class="callout__emoji">⚠</span>
        <div>
          <strong>Häufiger Fehler</strong>
          <p class="note" style="margin: 0.25rem 0 0">Nur Foodiary ohne kcal → Progress bleibt 0. Zuerst Buddy Log auf Home.</p>
        </div>
      </div>
    </main>
    <div id="help-shell-footer"></div>
    <script src="../js/shell.js" data-page="home-guide" data-lang="de" data-base="../" defer></script>
  </body>
</html>
